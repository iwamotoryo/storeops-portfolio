<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>宅建学習・分析システム — ポートフォリオ用デモ</title>
<!--
  ポートフォリオ用デモ（架空データ・外部通信ゼロ・依存ライブラリなし）

  CSS と JS を別ファイルに分けているのは、公開時に
  Content-Security-Policy: script-src 'self'; style-src 'self'
  を 'unsafe-inline' なしで通すため。

  CSP は <meta> ではなく HTTP response header で付ける（_headers 参照）。
  frame-ancestors は meta では無視される仕様であり、clickjacking 対策は
  header でしか成立しないため。meta を置かないので、手元でファイルを
  直接開いたときも relative な css/js がそのまま読める。
-->
<link rel="stylesheet" href="demo.css" />
</head>
<body>

<div class="demobar">
  <strong>ポートフォリオ用デモ</strong>
  <span>表示されている人物・成績・問題・学習履歴・アカウントはすべてデモデータです（架空）。</span>
</div>

<header class="app">
  <div class="head-row">
    <span class="brand">宅建学習・分析システム</span>
    <span class="badge badge--demo">DEMO</span>
    <span class="spacer"></span>
    <button class="btn btn--danger" id="resetBtn" type="button">デモをリセット</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="デモの画面切り替え"></nav>
</header>

<main id="view"></main>

<footer class="app">
  ポートフォリオ用のデモです。ログイン不要・保存はこのブラウザ内のデモ専用領域だけ。<br />
  実運用中のシステム・実在の受講生・実際の宅建試験の問題文とは無関係です。
</footer>

<!-- トーストとモーダルの差し込み先（中身は JS が createElement で組み立てる） -->
<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>
<div id="modalHost"></div>

<script src="demo.js"></script>
</body>
</html>
